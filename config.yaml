# Abbie Configuration File
# Routing is an ordered list: each request is evaluated top to bottom; the first rule
# that can select a backend wins. Use a list to combine strategies (e.g. query param
# first, then round-robin for everyone else).

app:
  port: "8080"

# Backend services configuration
backends:
  - name: defense-backend
    host: landing-page-a.internal
    port: 3000
    groups:
      - defense
      - government

  - name: healthcare-backend
    host: landing-page-b.internal
    port: 3000
    groups:
      - healthcare
      - medical

  - name: default-backend
    host: landing-page-default.internal
    port: 3000
    groups:
      - default

routing:
  # Match ?audience=... (or cookie) to a group first; if missing, fall through to round-robin.
  - strategy: query-param
    param_name: audience
    default_group: default
  - strategy: round-robin
    # Optional: only these backends participate in rotation (names must match `backends:`).
    # targets:
    #   - defense-backend
    #   - healthcare-backend

# Optional: share round-robin progression across restarts and multiple Abbie instances.
# Connection URI (redis://...) must come from process env—not from this file—see url_env:
# state:
#   redis:
#     url_env: REDIS_URL
#     key_prefix: "abbie:rr:"
# Or use addr/password/db in config (no secrets in YAML if avoid password field):
#   redis:
#     addr: "localhost:6379"
#     db: 0
